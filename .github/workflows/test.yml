name: Test templates

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.11"

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.1 --activate

      - name: Configure Yarn defaults
        run: |
          yarn config set -H npmMinimalAgeGate 14d
          yarn config set -H npmPreapprovedPackages --json '["@wix/*"]'

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: tests

      - name: Initialize git
        run: |
          git config --global user.email "wix@wix.com"
          git config --global user.name "wix cli"

      - name: Run TypeScript type check
        run: yarn typecheck
        working-directory: tests

      - name: Login to Wix CLI
        run: npx @wix/cli login --api-key ${{ secrets.WIX_API_KEY }}

      - name: Test
        run: yarn test
        working-directory: tests
