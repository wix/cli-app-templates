name: Test templates

on:
  pull_request:
    branches:
      - custom-extensions-templates

concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install --global "$(node -p "require('./package.json').packageManager")"

      - name: Configure Yarn defaults
        run: |
          yarn config set -H npmMinimalAgeGate 14d
          yarn config set -H npmPreapprovedPackages --json '["@wix/*"]'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check for duplicate dependencies
        run: yarn dedupe --check

      - name: Initialize git
        run: |
          git config --global user.email "wix@wix.com"
          git config --global user.name "wix cli"

      - name: Check formatting
        run: yarn check-format

      - name: Run TypeScript type check
        run: yarn workspaces foreach --all run typecheck

      - name: Login to Wix CLI
        run: npx @wix/cli login --api-key ${{ secrets.WIX_API_KEY }}

      - name: Test
        run: yarn workspaces foreach --all run test
